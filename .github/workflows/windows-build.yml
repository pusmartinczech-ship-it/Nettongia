name: Windows build

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Resolve the newest supported CPython 3.12 patch on the hosted image.
          # The exact resolved version is captured in BUILD_ENVIRONMENT.txt.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-windows.lock

      - name: Restore hash-pinned offline OCR bundle
        shell: powershell
        run: python ./tools/fetch_ocr_assets.py

      - name: Build and self-test portable package
        shell: powershell
        run: ./tools/build_windows.ps1

      - name: Run source regression suite
        shell: powershell
        run: ./.venv-build/Scripts/python.exe -m pytest -q

      - name: Run final golden PDF audit
        shell: powershell
        run: ./.venv-build/Scripts/python.exe ./tools/golden_pdf_audit.py --output-dir dist/integration-golden

      - name: Run repeated GUI memory soak
        shell: powershell
        run: ./.venv-build/Scripts/python.exe ./tools/integration_soak.py --cycles 60 --timeout 20 --output dist/integration-memory.json

      - name: Test OCR from a clean portable extraction
        shell: powershell
        run: |
          $archive = Get-ChildItem dist\Nettongia_PDF_Editor_*-portable.zip | Select-Object -First 1
          $cleanRoot = Join-Path $env:RUNNER_TEMP "Čistý OCR balíček žluťoučký kůň"
          Remove-Item $cleanRoot -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive $archive.FullName -DestinationPath $cleanRoot
          Remove-Item Env:TESSDATA_PREFIX -ErrorAction SilentlyContinue
          if (Get-Command tesseract.exe -ErrorAction SilentlyContinue) {
            throw "Acceptance runner unexpectedly has a system Tesseract installation."
          }
          $executable = Get-ChildItem $cleanRoot -Filter NettongiaPDFEditor.exe -Recurse | Select-Object -First 1
          $acceptanceResult = Join-Path $cleanRoot "výsledek OCR.json"
          $acceptanceProcess = Start-Process -FilePath $executable.FullName `
            -ArgumentList @("--ocr-acceptance", ('"' + $acceptanceResult + '"')) `
            -Wait -PassThru
          if (-not (Test-Path $acceptanceResult)) { throw "OCR acceptance report was not created." }
          Get-Content $acceptanceResult -Raw | Write-Host
          Copy-Item $acceptanceResult dist\portable-ocr-acceptance.json -Force
          $result = Get-Content $acceptanceResult -Raw | ConvertFrom-Json
          if ($acceptanceProcess.ExitCode -ne 0) { throw "Clean portable OCR acceptance failed." }
          if (($result.status -ne "passed") -or
              ($result.checks.isolated_ocr_execution -ne "passed") -or
              ($result.checks.process_cancellation -ne "passed")) {
            throw "Clean portable package did not pass the complete OCR matrix."
          }

      - name: Upload portable release candidate
        uses: actions/upload-artifact@v4
        with:
          name: Nettongia-PDF-Editor-Windows-portable
          path: |
            dist/*-portable.zip
            dist/self-test.json
            dist/distribution-size.json
            dist/portable-ocr-acceptance.json
            dist/integration-memory.json
            dist/integration-golden/*.json
            dist/integration-golden/*.md
            BUILD_ENVIRONMENT.txt
          if-no-files-found: error

      - name: Publish unsigned portable beta
        if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')) || (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/publish-v')) }}
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Get-ChildItem dist\Nettongia_PDF_Editor_*-portable.zip | Select-Object -First 1
          if (-not $archive) { throw "The verified portable archive is missing." }
          $versionText = Get-Content openpdf_editor\__init__.py -Raw
          if ($versionText -notmatch '__version__\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            throw "Unable to determine the application version for the release tag."
          }
          $expectedTag = "v$($Matches[1])"
          $releaseTarget = $env:GITHUB_SHA
          if ($env:GITHUB_EVENT_NAME -eq "pull_request") {
            $releaseTag = $env:GITHUB_HEAD_REF.Replace("release/publish-", "")
            $releaseTarget = "main"
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $releaseTag = $env:GITHUB_REF_NAME
          } else {
            $releaseTag = $expectedTag
          }
          if ($releaseTag -ne $expectedTag) {
            throw "Release branch/tag $releaseTag does not match application version $expectedTag."
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 $archive.FullName).Hash.ToLowerInvariant()
          $notes = @"
          ## Nettongia PDF Editor $releaseTag — unsigned public beta

          This release contains only the verified portable Windows 10/11 x64 ZIP. Extract it to a folder and run NettongiaPDFEditor.exe; no installation is required.

          The executable is not yet code-signed, so Windows may show an **Unknown publisher** or SmartScreen warning. Do not disable SmartScreen or antivirus protection.

          SHA-256: $sha256
          "@
          $notes | Set-Content -Encoding utf8 dist\release-notes.md
          gh release view $releaseTag *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)
          if ($releaseExists) {
            gh release upload $releaseTag $archive.FullName --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload the verified portable archive." }
            gh release edit $releaseTag `
              --title "Nettongia PDF Editor $releaseTag (unsigned public beta)" `
              --notes-file dist\release-notes.md
          } else {
            gh release create $releaseTag $archive.FullName `
              --target $releaseTarget `
              --title "Nettongia PDF Editor $releaseTag (unsigned public beta)" `
              --notes-file dist\release-notes.md
          }
